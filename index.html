  #topShade{position:fixed;left:0;right:0;top:0;height:30vh;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.8s ease .4s;

  #carCv{position:fixed;left:0;top:0;width:100%;height:100%;z-index:5;pointer-events:none;visibility:hidden}
  #bgWord{position:absolute;left:5vw;width:90vw;top:38vh;top:38dvh;transform:translateY(-50%);z-index:1;pointer-events:none;opacity:0}   /* 화면 정중앙 */
  #bgWord svg{display:block;width:100%;height:auto;aspect-ratio:100/13.49;overflow:visible}

  #driverText b{font-weight:var(--type-title-w);color:#86A8FF}
  #storyText{left:50%;top:50%;transform:translate(-50%,-50%);font-weight:var(--type-story-w);font-size:var(--storyFs,var(--type-story-size));line-height:var(--type-story-lh);letter-spacing:var(--type-story-track);width:96%;color:#35353b}
  @media (max-width:640px){ #driverText{left:50%;top:50%;font-size:clamp(26px,7.2vw,34px)} #storyText{width:98%} }
  #heyText b{font-weight:var(--type-title-w);color:#86A8FF}
  #heyText .ruler{position:static;visibility:hidden;height:0;overflow:hidden}

  /* ── GNB : 왼쪽 심볼 · 오른쪽 언어 ── */
  #gnb{position:fixed;left:0;right:0;top:0;z-index:var(--z-nav);height:calc(var(--margin) + 28px);padding-inline:var(--margin);display:flex;align-items:center;justify-content:space-between;color:#fff;mix-blend-mode:difference;pointer-events:none}   /* difference : 어두운 곳에선 흰색, 밝은 곳에선 검정으로 자동 반전 */
  #gnb a,#gnb button{pointer-events:auto}
  .sym{display:block;width:27px;height:22px;margin-left:-3px;color:inherit;text-decoration:none;outline-offset:4px}
  .sym>svg:not(.sw){display:block;width:100%;height:100%;overflow:visible}
    .lang{position:relative;font:var(--type-label-w) var(--type-label-size)/var(--type-label-lh) var(--font-ui);letter-spacing:var(--type-label-track)}
  .lang>button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 0;text-transform:uppercase;position:relative}
  /* ── 공통 호버 : 심볼의 곡선과 같은 선이 요소 위를 한 번 지나간다 ([data-sw] 에 JS 가 svg 주입) ── */
  [data-sw]{position:relative}
  /* 호버 : 가로선 하나가 글자 아래에서 위로 올라오며, 지나간 자리에 글자가 새로 생긴다 */
  .sp{position:relative;display:inline-block;white-space:nowrap}
  .sp .a{display:block}
  .sp .b{position:absolute;left:-1px;right:-1px;top:calc(100% - 4px);height:1px;background:currentColor;opacity:0;pointer-events:none}
  @keyframes spA{0%{clip-path:inset(100% 0 0 0);transform:translateY(6px)}100%{clip-path:inset(-2px 0 -2px 0);transform:none}}
  @keyframes spB{0%{top:calc(100% + 2px);opacity:0}14%{opacity:.9}100%{top:-6px;opacity:0}}   /* 선은 글자가 생기는 경계보다 4px 앞서 올라간다 → 글자와 겹치지 않음 */
  [data-sw]:hover .sp .a,[data-sw]:focus-visible .sp .a,#langBtn[aria-expanded="true"] .sp .a{animation:spA 640ms cubic-bezier(.45,0,.15,1) 1 both}
  [data-sw]:hover .sp .b,[data-sw]:focus-visible .sp .b,#langBtn[aria-expanded="true"] .sp .b{animation:spB 640ms cubic-bezier(.45,0,.15,1) 1 both}
  .sw{display:none}
  @media (prefers-reduced-motion:reduce){.sp .a,.sp .b{animation:none!important}}

  /* 드롭다운 : 박스 없이 텍스트만. 헤더와 같은 difference 로 어떤 배경에서도 읽힌다 */
  .langpop{position:fixed;z-index:calc(var(--z-nav) + 1);right:var(--margin);top:calc((var(--margin) + 28px) / 2 + 22px);color:#fff;mix-blend-mode:difference;pointer-events:none;font:400 12px/1 var(--font-ui);letter-spacing:.06em}

  .langpop li{opacity:0;transform:translateY(-4px);transition:opacity var(--d-fast) var(--ease-out),transform var(--d-base) var(--ease-out)}
  .langpop.open li{opacity:1;transform:none;transition-delay:calc(var(--i,0) * 38ms)}
  .langpop li button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:9px 0;position:relative;opacity:.5;transition:opacity var(--d-fast) var(--ease-out)}
  .langpop li button:hover,.langpop li button:focus-visible,.langpop li button[aria-checked="true"]{opacity:1}
  .langpop:not(.open){visibility:hidden;transition:visibility 0s var(--d-fast)}
  .langpop.open{visibility:visible;pointer-events:none}
  .langpop.open li button{pointer-events:auto}
  .langpop li button:focus-visible{outline:1px solid currentColor;outline-offset:4px}

  /* ── 로고 씬 : 은근한 리플 그리드 위에 심볼이 그려지고 → 왼쪽으로 빠지며 → LIEU 워드마크 ── */

  /* ── 오프닝 : 검정 화면에 흰 로고(모핑 + LIEU) → 가운데 선을 따라 위아래로 열린다 ── */
  #intro{position:fixed;inset:0;z-index:300;pointer-events:all;color:#fff}
  #intro{transition:opacity 2.2s cubic-bezier(.2,.1,.35,1)}
  #intro .half{position:absolute;left:0;right:0;height:50.2%;background:#06060A}
  #intro .top{top:0}
  #intro .bottom{bottom:0}
  #intro.open{opacity:0;pointer-events:none}
  #intro .logo{position:absolute;inset:0;transition:opacity .8s cubic-bezier(.45,0,.25,1)}
  #intro.logo-out .logo{opacity:0}
  #introSym,#introText{position:absolute;overflow:visible}
  #introSym.metal,#introText.metal{opacity:0 !important}   /* 크롬 캔버스가 대신 그린다 */
  /* ── 커서 : 솔리드 원 하나 (difference). 누를 수 있는 곳에서는 커졌다가, 누르면 작아진다 ── */
  @media (hover:hover) and (pointer:fine){ html.cur, html.cur *{cursor:none!important} }
  /* ── 모바일 (≤640px) : 터치 영역 · 가독성 · 구도 ── */
  @media (max-width:640px){
    .sym{position:relative}
    .sym::after{content:"";position:absolute;inset:-14px -18px}                    /* 심볼 터치 영역 확대 (44px 이상) */
    .lang>button{padding:16px 0 16px 14px;margin-right:-2px}
    #gnb{height:calc(var(--margin) + 28px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}   /* 노치 · 다이내믹 아일랜드 */
    #hero{top:clamp(40px,24dvh,240px)}   /* 세로로 긴 화면에서 도넛이 위에 몰리지 않고 시각 중심에 오도록 */
    .langpop{mix-blend-mode:normal;background:rgba(10,12,20,.74);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:16px;padding:6px 20px;top:calc(var(--margin) + 36px + env(safe-area-inset-top,0px));right:var(--margin);box-shadow:0 12px 40px rgba(0,0,0,.28)}
    .langpop ul{gap:0;padding:0}
    .langpop li button{padding:14px 0;font-size:14px;opacity:.55}
    .langpop li button:hover,.langpop li button:focus-visible,.langpop li button[aria-checked="true"]{opacity:1}
    #heyText{font-size:clamp(26px,7.2vw,34px)}
  }
  #cur{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:500;mix-blend-mode:difference;color:#fff;opacity:0;transition:opacity .4s ease}
  #cur.on{opacity:1}
  #cur i{position:absolute;left:0;top:0;display:block;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:currentColor;will-change:transform;transition:width .5s cubic-bezier(.16,1,.3,1),height .5s cubic-bezier(.16,1,.3,1),margin .5s cubic-bezier(.16,1,.3,1)}
  #cur.hov i{width:44px;height:44px;margin:-22px 0 0 -22px}
  #cur.down i{width:10px;height:10px;margin:-5px 0 0 -5px}
  #cur.hov.down i{width:34px;height:34px;margin:-17px 0 0 -17px}
  body:not(.ready) #gnb,body:not(.ready) .langpop{opacity:0}
  #gnb,.langpop{transition:opacity .9s ease .5s}
</style>

const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp  = (a, b, t) => a + (b - a) * t;
const prog  = (t, a, b) => clamp((t - a) / (b - a));
const Ease = {
